<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Civil OS</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #050505;
            color: #00ff66;
            font-family: monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .boot-screen {
            width: 90%;
            max-width: 800px;
        }

        .logo {
            font-size: 42px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
        }

        .line {
            margin: 12px 0;
        }

        .loading {
            width: 100%;
            height: 20px;
            border: 1px solid #00ff66;
            margin-top: 25px;
        }

        .progress {
            height: 100%;
            width: 0%;
            background: #00ff66;
            animation: load 4s forwards;
        }

        .message {
            margin-top: 25px;
            color: #aaa;
            text-align: center;
        }

        @keyframes load {
            from {
                width: 0%;
            }

            to {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="boot-screen">

        <div class="logo">
            CIVIL OS
        </div>

        <div class="line">
            &gt; Initializing Civil Operating System...
        </div>

        <div class="line">
            &gt; Loading citizens................ OK
        </div>

        <div class="line">
            &gt; Loading government services..... OK
        </div>

        <div class="line">
            &gt; Loading bureaucracy............. OK
        </div>

        <div class="line">
            &gt; Checking efficiency............. FAILED
        </div>

        <div class="loading">
            <div class="progress"></div>
        </div>

        <div class="message">
            Please wait while society is being initialized...
        </div>

    </div>

</body>
</html>
